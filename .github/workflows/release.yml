name: Release

# 自動公開はしない。
# main への push で動かすと、コミットメッセージの BREAKING CHANGE などから
# semantic-release が勝手に版を上げて npm に公開してしまう。
# 公開するときは、GitHub の Actions 画面からこのワークフローを手動で実行する。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "試し実行（公開せず、何が起きるかだけを出す）"
        type: boolean
        default: true

# semantic-release と npm の provenance に必要な権限。
#   contents: write       タグと GitHub Release の作成
#   issues / pull-requests: write  リリース告知のコメント
#   id-token: write       npm の provenance（NPM_CONFIG_PROVENANCE: true に必須）
# 手動実行に変えたときに落としてしまい、provenance 付き公開が失敗する状態だった。
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check Japanese
        run: pnpm check:ja

      - name: Build
        run: pnpm build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
